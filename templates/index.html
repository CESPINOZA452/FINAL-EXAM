<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API REST de Estudiantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 10px;
            margin: 10px;
            background: #f1f1f1;
            color: #000000;
        }
        
        h1 { 
            text-align: center; 
            color: #000000;
            font-size: 30px;       /* ✅ MÁS PEQUEÑO */
            margin-bottom: 10px;   /* ✅ MENOS ESPACIO */
        }
        
        h2 {
            font-size: 15px;
            margin-top: 1px;
            margin-bottom: 1px; /* ✅ reduce espacio vertical */
        }
        
        /* Contenedor principal en Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            height: fit-content;
        }
        label {
            display: block;
            margin: 8px 0 4px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 6px 10px;
            margin: 2px 2px 0 0;
            font-size: 10px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button.secondary {
            background: #757575;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .form-group-inline {
            display: flex; gap: 10px; align-items: flex-end;
        }
        .output-box {
            background: #222;
            color: #eee;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Gestión de Estudiantes</h1>

    <div class="dashboard">
        <!-- Columna Izquierda: Consultas y Acciones Rápidas -->
        <div class="column">
            <section>
                <h2>Consultas Rápidas</h2>
                <button id="btn-list">Listar JSON</button>
                <button class="secondary" id="btn-view-table">Ver Tabla HTML</button>
                <button id="btn-average">Calcular Promedio</button>
            </section>

            <section>
                <h2>Búsqueda y Eliminación</h2>
                <div class="form-group-inline">
                    <div style="flex:1">
                        <label for="student-id">ID Estudiante</label>
                        <input id="student-id" type="number" placeholder="ID" min="1">
                    </div>
                    <button id="btn-get">Buscar</button>
                    <button id="btn-delete" style="background:#dc3545">Eliminar</button>
                </div>
            </section>

            <section>
                <h2>Inserción en Bloque</h2>
                <textarea id="bulk-json" rows="5" placeholder='[{"name":"Ana","dni":"123","age":20,"grade":15}]'></textarea>
                <button id="btn-bulk" class="full-width">Procesar JSON</button>
            </section>
        </div>

        <!-- Columna Derecha: Formularios de Datos -->
        <div class="column">
            <section>
                <h2>Crear / Actualizar</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label for="update-id">ID (solo para Update)</label>
                        <input id="update-id" type="number" placeholder="ID a modificar">
                    </div>
                    <div>
                        <label for="create-dni">DNI</label>
                        <input id="create-dni" type="text" placeholder="DNI">
                    </div>
                </div>
                
                <label for="create-name">Nombre Completo</label>
                <input id="create-name" type="text" placeholder="Nombre">

                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div>
                        <label for="create-age">Edad</label>
                        <input id="create-age" type="number" placeholder="Edad">
                    </div>
                    <div>
                        <label for="create-grade">Nota</label>
                        <input id="create-grade" type="number" step="0.1" placeholder="0-20">
                    </div>
                    
                    <div style="display:flex; align-items:center; gap:5px; padding-top:10px;">
                        <input id="create-approved" type="checkbox">
                        <label for="create-approved" style="margin:0">Aprobado</label>
                    </div>

                </div>

                <div style="margin-top:15px; display:flex; gap:10px;">
                    <button id="btn-create" style="flex:1">Crear Nuevo</button>
                    <button id="btn-update" class="secondary" style="flex:1">Actualizar por ID</button>
                </div>
            </section>
        </div>

        <section class="full-width">
                <h2>Resultado de API</h2>
                <div id="output" class="output-box">Esperando acción...</div>
        </section>

    </div>

    <script>
        const output = document.getElementById('output');

        // Función para convertir cualquier JSON de la API en una tabla HTML dinámica
        function jsonToTable(data) {
            if (!data) return "";
            
            // Manejo de mensajes simples (ej. Eliminación exitosa)
            if (typeof data === 'object' && data.message && Object.keys(data).length === 1) {
                return `<div style="color: #00ff00; font-weight: bold; font-family: monospace;">${data.message}</div>`;
            }

            let items = [];
            let extraInfo = "";
            
            // Normalizar datos: Convertir objeto único o respuesta masiva en array para la tabla
            if (Array.isArray(data)) {
                items = data;
            } else if (data.students && Array.isArray(data.students)) {
                items = data.students;
                extraInfo = `<p style="color: #00ff00; font-family: monospace;">${data.message}</p>`;
            } else {
                items = [data];
            }

            if (items.length === 0 || (items.length === 1 && items[0] === null)) return "No hay datos disponibles.";

            const headers = Object.keys(items[0]);
            let html = extraInfo + '<div style="overflow-x: auto;"><table style="width:100%; border-collapse: collapse; background: #000; color: white; font-size: 11px; margin-top: 5px; border: 1px solid #ddd;">';
            
            html += '<thead style="background: #000; color: white;"><tr>';
            headers.forEach(h => html += `<th style="padding: 6px; border: 1px solid #ddd; text-align: left;">${h.toUpperCase()}</th>`);
            html += '</tr></thead><tbody>';
            
            items.forEach(item => {
                html += '<tr>';
                headers.forEach(h => {
                    let val = item[h];
                    if (typeof val === 'boolean') val = val ? 'SÍ' : 'NO';
                    html += `<td style="padding: 6px; border: 1px solid #ddd;">${val ?? '-'}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        async function callApi(path, method = 'GET', body = null) {
            try {
                const options = { method, headers: {} };
                if (body !== null) {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(path, options);
                const contentType = response.headers.get("content-type");
                const responseText = await response.text();
                
                const headerHtml = `<div style="color: #00ff00; margin-bottom: 8px; font-weight: bold; font-family: monospace; border-bottom: 1px solid #444; padding-bottom: 4px;">HTTP ${response.status} ${response.statusText}</div>`;

                if (contentType && contentType.includes("application/json")) {
                    try {
                        const data = JSON.parse(responseText);
                        output.innerHTML = headerHtml + jsonToTable(data);
                    } catch (e) {
                        output.innerHTML = headerHtml + `<pre style="color: white; margin:0;">${responseText}</pre>`;
                    }
                } else {
                    output.innerHTML = headerHtml + responseText;
                }
            } catch (error) {
                output.innerHTML = `<div style="color: #ff4d4d; font-family: monospace;">Error: ${error.message}</div>`;
            }
        }

        function getValue(id) {
            return document.getElementById(id).value.trim();
        }

        document.getElementById('btn-list').addEventListener('click', () => {
            callApi('/students', 'GET');
        });

        document.getElementById('btn-view-table').addEventListener('click', () => {
            callApi('/view/students', 'GET');
        });

        document.getElementById('btn-get').addEventListener('click', () => {
            const id = getValue('student-id');
            if (!id) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Debe ingresar un ID válido.</div>';
                return;
            }
            callApi(`/students/${id}`, 'GET');
        });

        document.getElementById('btn-create').addEventListener('click', () => {
            const name = getValue('create-name');
            const dni = getValue('create-dni');
            const age = getValue('create-age');
            const grade = getValue('create-grade');
            const isApproved = document.getElementById('create-approved').checked;

            if (!name || !dni || !age || !grade) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Complete todos los campos para crear el estudiante.</div>';
                return;
            }

            callApi('/students', 'POST', {
                name,
                dni,
                age: Number(age),
                grade: Number(grade),
                is_approved: isApproved
            });
        });

        document.getElementById('btn-update').addEventListener('click', () => {
            const id = getValue('update-id');
            if (!id) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Ingrese el ID del estudiante a actualizar.</div>';
                return;
            }

            const body = {};
            const name = getValue('create-name');
            const dni = getValue('create-dni');
            const age = getValue('create-age');
            const grade = getValue('create-grade');
            const isApproved = document.getElementById('create-approved').checked;

            if (name) body.name = name;
            if (dni) body.dni = dni;
            if (age) body.age = Number(age);
            if (grade) body.grade = Number(grade);
            body.is_approved = isApproved;

            if (Object.keys(body).length === 0) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Ingrese al menos un campo para actualizar.</div>';
                return;
            }

            callApi(`/students/${id}`, 'PUT', body);
        });

        document.getElementById('btn-delete').addEventListener('click', () => {
            const id = getValue('student-id');
            if (!id) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Ingrese el ID para eliminar.</div>';
                return;
            }
            callApi(`/students/${id}`, 'DELETE');
        });

        document.getElementById('btn-bulk').addEventListener('click', () => {
            const raw = document.getElementById('bulk-json').value.trim();
            if (!raw) {
                output.innerHTML = '<div style="color: #ffc107; font-family: monospace;">Ingrese el JSON para carga masiva.</div>';
                return;
            }
            try {
                const data = JSON.parse(raw);
                callApi('/students/bulk', 'POST', data);
            } catch (error) {
                output.innerHTML = `<div style="color: #ff4d4d; font-family: monospace;">JSON inválido: ${error.message}</div>`;
            }
        });

        document.getElementById('btn-average').addEventListener('click', () => {
            callApi('/students/average', 'GET');
        });
    </script>
</body>
</html>
